[project]
name = "kivi-phonetic-memory"
version = "1.0.0"
description = "Word-level (phonetic) memory that moves a transcript from formatted to memory-aware."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "jellyfish==1.1.3",
    "Metaphone==0.6",
    "rapidfuzz==3.11.0",
    "PyYAML==6.0.2",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["app", "cli", "eval"]
